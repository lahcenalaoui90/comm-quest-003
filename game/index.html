<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mail Rush</title>
<meta name="theme-color" content="#14152b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one arcade-cabinet column. Game screen on top, dialog strip under it, touch pad at the bottom. */
:root{
  --ink:#14152b; --panel:#22264d; --line:#3d4383; --paper:#f7f4ec; --sun:#ffd84a; --teal:#2bb3a3; --coral:#ff6b5a; --muted:#aeb2df; --good:#3fbf6a; --bad:#e2483d;
  --px:"Press Start 2P", ui-monospace, monospace; --body:"Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ink);color:var(--paper)}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:16px 16px}
.wrap{max-width:900px;margin:0 auto;padding-block:14px 24px;padding-inline:16px;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:6px;min-width:0}
h1{font-family:var(--px);font-size:clamp(15px,3.4vw,22px);margin:0;color:var(--sun);letter-spacing:1px;text-shadow:3px 3px 0 #000}
.sub{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--px);font-size:10px;line-height:1.3;background:var(--panel);color:var(--paper);border:2px solid #000;padding:10px 12px;cursor:pointer;box-shadow:0 3px 0 #000;border-radius:0}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn:focus-visible,.opt:focus-visible,.pad button:focus-visible,.floor:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn.go{background:var(--sun);color:var(--ink)}
.btn.red{background:var(--coral);color:#fff}
.screen{position:relative;width:100%;max-width:min(640px,calc((100dvh - 380px) * 1.667));min-width:min(100%,300px);margin-inline:auto;border:4px solid #000;box-shadow:0 0 0 4px var(--line),0 10px 0 4px #000;background:#000;line-height:0}
#game{width:100%;height:auto;display:block;aspect-ratio:320/192;image-rendering:pixelated;image-rendering:crisp-edges}
.say{min-height:70px;background:var(--panel);border:3px solid #000;box-shadow:0 0 0 3px var(--line);padding:10px 12px;display:flex;gap:12px;align-items:center;font-size:15px}
.say canvas{width:36px;height:48px;image-rendering:pixelated;flex:none}
.say .txt{min-width:0}
.say b{font-family:var(--px);font-size:9px;color:var(--sun);display:block;margin-bottom:5px;letter-spacing:.5px}
.keys{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
kbd{font-family:var(--px);font-size:9px;background:var(--panel);border:2px solid #000;padding:3px 5px;color:var(--paper)}
.pad{display:none;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
.pad .grp{display:flex;gap:12px}
.pad button{font-family:var(--px);width:78px;height:66px;font-size:20px;background:var(--panel);color:var(--paper);border:3px solid #000;box-shadow:0 5px 0 #000;touch-action:none;border-radius:0;-webkit-tap-highlight-color:transparent}
.pad button.jump{width:116px;background:var(--coral);font-size:12px}
.pad button.on{transform:translateY(4px);box-shadow:0 1px 0 #000}
@media (pointer:coarse){.pad{display:flex}.keys{display:none}}
.msg{background:var(--sun);color:var(--ink);border:4px solid #000;box-shadow:6px 6px 0 #000;padding:12px 14px;min-height:110px;cursor:default}
.msg .mtag{font-family:var(--px);font-size:9px;letter-spacing:1px;margin-bottom:8px;opacity:.75}
.msg p{margin:0;font-size:clamp(17px,2.6vw,21px);font-weight:500;line-height:1.35;text-wrap:balance}
#msgFb{font-size:15px;margin-top:8px}
#msgFb:empty{display:none}
#msgFb b{display:block;font-size:16px;margin-bottom:2px}
#msgFb .tap{display:block;font-size:12px;opacity:.7;margin-top:6px}
.msg.ok{background:#c9f2d6}.msg.no{background:#f7c7c2;cursor:pointer}
.lanes{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:10px}
@media (max-width:560px){.lanes{gap:7px}.lanes.n5{grid-template-columns:repeat(3,minmax(0,1fr))}.lane{font-size:12.5px;min-height:78px;padding:8px 3px 10px}.lane .ic{font-size:20px}.lane .lb{font-size:11.5px;letter-spacing:-.2px;overflow-wrap:anywhere}.msg{min-height:96px}.msg p{font-size:17px}}
.lane{font:500 15px var(--body);background:#fff;color:var(--ink);border:3px solid #000;border-top:10px solid var(--c);box-shadow:0 5px 0 #000;padding:10px 6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:92px;border-radius:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;position:relative}
.lane:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.lane:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.lane i{font-style:normal;font-family:var(--px);font-size:9px;position:absolute;top:4px;left:5px;opacity:.6}
.lane .ic{font-size:24px;line-height:1.1}
.lane .lb{font-weight:700;text-align:center;line-height:1.2;hyphens:auto}
.review{margin-top:12px;display:grid;gap:8px}
.review>b{font-size:15px}
.rv{border:2px solid #000;background:#fff;padding:8px 10px;font-size:14px}
.rt{font-weight:500;margin-bottom:3px}.ra{color:#a3271f}.rw{color:#3b3f5c;margin-top:2px}
/* modals */
.modal{position:fixed;inset:0;background:rgba(9,10,24,.84);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.card{background:var(--paper);color:var(--ink);border:4px solid #000;box-shadow:8px 8px 0 #000;max-width:600px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:22px 20px}
.card h2{font-family:var(--px);font-size:clamp(13px,3vw,17px);line-height:1.5;margin:0 0 10px;text-wrap:balance}
.card p{margin:0 0 12px}
.tag{font-family:var(--px);font-size:9px;letter-spacing:1px;color:#6a5a00;background:var(--sun);display:inline-block;padding:5px 7px;border:2px solid #000;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.defs{display:grid;gap:8px;margin:12px 0}
.def{border:2px solid #000;background:#fff;padding:9px 11px}
.def b{display:block;font-size:14px;margin-bottom:2px}
.def span{font-size:14px;color:#3b3f5c}
.how{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;margin:12px 0;font-size:15px}
.how .ic{width:34px;height:34px;image-rendering:pixelated}
input.name{font:500 18px var(--body);width:100%;padding:12px;border:3px solid #000;background:#fff;color:var(--ink);border-radius:0}
input.name:focus{outline:3px solid var(--teal);outline-offset:1px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.q{font-size:17px;font-weight:500;margin-bottom:12px}
.ctx{font-size:15px;background:#fff;border:2px dashed #000;padding:10px;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:500 15px var(--body);background:#fff;color:var(--ink);border:3px solid #000;padding:11px 12px;cursor:pointer;box-shadow:0 3px 0 #000;display:flex;gap:10px;align-items:flex-start;border-radius:0}
.opt i{font-style:normal;font-family:var(--px);font-size:10px;background:var(--ink);color:#fff;padding:4px 6px;flex:none;margin-top:1px}
.opt:hover{background:#fff6cf}
.opt.right{background:#d9f5e1;border-color:var(--good)}
.opt.wrong{background:#fbdcd8;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.why{margin-top:12px;padding:10px 12px;border:3px solid #000;font-size:15px}
.why.ok{background:#d9f5e1}.why.no{background:#fbdcd8}
.floors{display:grid;gap:10px;margin-top:8px}
.floor{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;color:var(--ink);border:3px solid #000;box-shadow:0 4px 0 #000;padding:10px 12px;cursor:pointer;font:15px var(--body);border-radius:0}
.floor .n{font-family:var(--px);font-size:14px;background:var(--ink);color:var(--sun);width:40px;height:40px;display:grid;place-items:center}
.floor .t{min-width:0}
.floor .t b{display:block;font-size:15px}
.floor .t span{font-size:13px;color:#4a4f70}
.floor .st{font-family:var(--px);font-size:9px;text-align:right;white-space:nowrap}
.floor.locked{background:#e5e2d8;cursor:not-allowed;box-shadow:none;opacity:.85}
.floor.locked .n{background:#777;color:#ddd}
.floor.done .st{color:#1d7a3e}
.big{font-family:var(--px);font-size:clamp(20px,6vw,30px);color:var(--coral);text-shadow:3px 3px 0 #000;margin:6px 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{border:3px solid #000;background:#fff;padding:10px 8px;text-align:center}
.stat b{font-family:var(--px);font-size:14px;display:block;margin-bottom:6px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:#4a4f70}
.small{font-size:13px;color:#4a4f70}
.foot{font-size:13px;color:var(--muted);text-align:center}
.foot b{color:var(--paper);font-weight:500;user-select:all}
@media (max-width:420px){.card{padding:18px 14px}.pad button{width:68px}.pad button.jump{width:100px}.stats{grid-template-columns:1fr 1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>MAIL RUSH</h1>
      <div class="sub">Module 3 : Business Communication · Lesson 1 · <span id="who"></span></div>
    </div>
    <div class="tools">
      <button class="btn" id="mapBtn" type="button">FLOORS</button>
      <button class="btn" id="sndBtn" type="button" aria-pressed="false">SOUND: OFF</button>
    </div>
  </header>
  <div class="screen"><canvas id="game" width="320" height="192" aria-label="Mail Rush game screen"></canvas></div>
  
  <div class="msg" id="msg" aria-live="polite"><div class="mtag" id="msgTag">INCOMING</div><p id="msgText">Your shift starts soon.</p><div id="msgFb"></div></div>
  <div class="lanes" id="lanes"></div>
  <div class="say" id="say" aria-live="polite"><canvas id="face" width="12" height="16"></canvas><div class="txt"><b id="sayName">MAYA</b><span id="sayText">Ready when you are.</span></div></div>
  <div class="keys"><span>Tap a bin, or press <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd>… on the keyboard</span><span><kbd>SPACE</kbd> skip the explanation</span></div>
  <div class="foot">Questions? Email your instructor: <b>mdarhri.lahcen@a1gcollege.ca</b></div>
</div>

<div class="modal" id="modal"><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
<script>

const LANE = {

  mode="menu"; let last=""; try{ last=localStorage.getItem(STORE+"|last")||""; }catch(e){}
  openModal(`<div class="tag">MODULE 3 · LESSON 1</div><h2>Welcome to Mail Rush</h2>
   <p>You play <b>Maya</b> in the Northline Build mail room. Read each message and send it to the right bin before it gets lost.</p>
   <label for="nm" class="small">Your first and last name</label>
   <input class="name" id="nm" autocomplete="name" value="${esc(last)}" placeholder="e.g. Sarah Babiker">
   <div class="err" id="nmErr"></div>
   <div class="row"><button class="btn go" id="nmGo" type="button">ENTER THE OFFICE ▶</button></div>`);
  const inp=document.getElementById("nm"); inp.focus(); inp.select();
  const go=()=>{ const v=inp.value.trim().replace(/\s+/g," "); if(v.length<3||!/\s/.test(v)){ document.getElementById("nmErr").textContent="Please type your first and last name."; inp.focus(); return; }
    P=loadProf(v); P.name=v; saveProf(); document.getElementById("who").textContent=v; send("Game · Signed in",null,""); showFloors(); };
  document.getElementById("nmGo").onclick=go; inp.onkeydown=e=>{ if(e.key==="Enter") go(); };
}

/* floor availability */
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dateOpen(n){ return INSTRUCTOR || today()>=UNLOCK[n]; }
function floorOpen(n){ return dateOpen(n) && (n===1 || INSTRUCTOR || P.cleared[n-1]); }
function niceDate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("en-CA",{weekday:"long",month:"long",day:"numeric"}); }

function showFloors(){
  mode="menu"; const tot=[1,2,3,4].reduce((s,n)=>s+(P.best[n]||0),0);
  const rows=[1,2,3,4].map(n=>{ const F=FLOORS[n], open=floorOpen(n), done=!!P.cleared[n];
    const st = done ? "✓ BEST "+P.best[n] : open ? "PLAY ▶" : (!dateOpen(n) ? "🔒 "+DAY_OF[n].toUpperCase() : "🔒 FINISH "+(n-1));
    return `<button class="floor ${open?"":"locked"} ${done?"done":""}" type="button" data-n="${n}" ${open?"":"aria-disabled=\"true\""}>
      <span class="n">${n}</span><span class="t"><b>${F.name}</b><span>${F.short}${!dateOpen(n)?" · opens "+niceDate(UNLOCK[n]):""}</span></span><span class="st">${st}</span></button>`; }).join("");
  openModal(`<div class="tag">BUILDING DIRECTORY${INSTRUCTOR?" · INSTRUCTOR MODE":""}</div><h2>Choose a floor</h2>
    <p class="small">A new part opens each day: Tuesday, Wednesday, then Thursday. Finish a floor to unlock the next one.</p>
    <div class="floors">${rows}</div>
    <div class="stats"><div class="stat"><b>${tot}</b><span>total best points</span></div><div class="stat"><b>${Object.keys(P.cleared).length}/4</b><span>floors cleared</span></div><div class="stat"><b>${rankOf(tot)}</b><span>your rank</span></div></div>
    <div class="row"><button class="btn" type="button" id="howBtn">HOW TO PLAY</button><button class="btn" type="button" id="swBtn">NOT ${esc(P.name.split(" ")[0].toUpperCase())}?</button></div>`);
  card.querySelectorAll(".floor").forEach(b=>b.onclick=()=>{ const n=+b.dataset.n; if(!floorOpen(n)){ b.querySelector(".st").textContent = !dateOpen(n)?"OPENS "+DAY_OF[n].toUpperCase():"FINISH FLOOR "+(n-1)+" FIRST"; return; } showBrief(n); });
  document.getElementById("howBtn").onclick=()=>showHow(showFloors);
  document.getElementById("swBtn").onclick=nameGate;
}
function rankOf(x){ return x>=12000?"DIRECTOR":x>=8000?"MANAGER":x>=4000?"COORD.":"INTERN"; }

/* message card + lane buttons */
const msgEl=document.getElementById("msg");
function showMsg(tag,text,fb,cls){
  if(tag!==null) document.getElementById("msgTag").textContent=tag;
  if(text!==null) document.getElementById("msgText").textContent=text;
  document.getElementById("msgFb").innerHTML=fb||"";
  msgEl.className="msg"+(cls?" "+cls:"");
}
function buildLaneButtons(){
  const box=document.getElementById("lanes"); box.innerHTML="";
  box.style.setProperty("--n",G.lanes.length); box.className="lanes n"+G.lanes.length;
  G.lanes.forEach((L,i)=>{ const b=document.createElement("button"); b.type="button"; b.className="lane"; b.style.setProperty("--c",L.col);
    b.innerHTML=`<i>${i+1}</i><span class="ic" aria-hidden="true">${L.icon}</span><span class="lb">${esc(L.label)}</span>`;
    b.addEventListener("pointerdown",e=>{ e.preventDefault(); choose(i); }); b.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); choose(i);} });
    box.appendChild(b); });
}
msgEl.addEventListener("click",()=>skipFb());

function showHow(back){
  const ic=c=>`<img class="ic" alt="" src="${iconImg(c,3)}">`;
  openModal(`<div class="tag">HOW TO PLAY</div><h2>Mail room survival guide</h2>
   <div class="how">
    ${ic(PARCEL)}<span>A message rolls along the belt. <b>Read it</b> in the yellow card under the game.</span>
    ${ic(MAYA.jump)}<span><b>Tap the right bin</b> (or press 1, 2, 3…) before the parcel reaches <b>LOST MAIL</b>.</span>
    ${ic(SCUP)}<span>You have <b>3 coffees</b>. A wrong bin or a lost parcel costs one.</span>
    ${ic(SENV)}<span>3 right answers in a row = <b>combo</b>: points ×2, ×3, ×4. Faster answers = bonus points.</span>
   </div>
   <p class="small">The belt speeds up as you get better. Your best score on each floor is sent to your instructor automatically.</p>
   <div class="row"><button class="btn go" type="button" id="hb">GOT IT ▶</button></div>`);
  document.getElementById("hb").onclick=back;
}
function showBrief(n){
  const F=FLOORS[n]; floorN=n; G=newGame(n); G.lanes=G.F.waves[0].lanes.map(k=>Object.assign({key:k},LANE[k])); G.phase="idle"; mode="menu";
  buildLaneButtons(); showMsg("FLOOR "+n, "Your shift starts when you press START.", "");
  openModal(`<div class="tag">FLOOR ${n} · ${DAY_OF[n].toUpperCase()}</div><h2>${F.name}</h2>
   <div class="defs">${F.brief.map(([t,d])=>`<div class="def"><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join("")}</div>
   <p><b>Mission:</b> ${esc(F.mission)}</p>
   <div class="row"><button class="btn go" type="button" id="bGo">START SHIFT ▶</button><button class="btn" type="button" id="bBack">FLOORS</button></div>`);
  document.getElementById("bGo").onclick=()=>{ closeModal(); startFloor(n); };
  document.getElementById("bBack").onclick=showFloors;
}
function showOver(){
  openModal(`<div class="tag">FLOOR ${floorN}</div><div class="big">OUT OF COFFEE</div>
   <p>Too much mail went to the wrong place. Look at the review below, then try the shift again.</p>
   ${reviewHtml()}
   <div class="row"><button class="btn go" type="button" id="oGo">TRY AGAIN ▶</button><button class="btn" type="button" id="oBack">FLOORS</button></div>`);
  document.getElementById("oGo").onclick=()=>{ closeModal(); startFloor(floorN); };
  document.getElementById("oBack").onclick=showFloors;
}
function reviewHtml(){ if(!G.mistakes.length) return `<p class="small">No mistakes. Perfect sorting!</p>`;
  return `<div class="review"><b>Review your mistakes</b>${G.mistakes.map(m=>`<div class="rv"><div class="rt">${esc(m.t)}</div><div class="ra">You: ${esc(m.your)} → Right bin: <b>${esc(m.right)}</b></div><div class="rw">${esc(m.why)}</div></div>`).join("")}</div>`; }
function finishShift(){
  mode="clear"; SFX.win();
  const n=floorN, score=G.score, prev=P.best[n]||0, isBest=score>prev, first=!P.cleared[n];
  P.cleared[n]=true; if(isBest) P.best[n]=score; saveProf();
  if(isBest||first) send("Game · Floor "+n+" cleared"+(isBest&&!first?" (new best)":""), score, "Floor "+n+": "+G.ok+"/"+G.tot+" correct, best combo "+G.maxCombo);
  const total=[1,2,3,4].reduce((s,k)=>s+(P.best[k]||0),0), last=n===4, nextOpen=!last&&floorOpen(n+1);
  const acc=Math.round(G.ok/Math.max(1,G.tot)*100);
  openModal(`<div class="tag">FLOOR ${n} · SHIFT OVER</div><div class="big">${last?"LESSON 1 COMPLETE!":acc>=80?"GREAT SHIFT!":"SHIFT DONE"}</div>
   <div class="stats"><div class="stat"><b>${score}</b><span>points</span></div><div class="stat"><b>${acc}%</b><span>accuracy</span></div><div class="stat"><b>x${Math.min(4,1+Math.floor(G.maxCombo/3))}</b><span>best combo</span></div></div>
   <p>${isBest?"New best score! It has been sent to your instructor.":"Your best on this floor is still "+prev+" points."}</p>
   ${last?`<p>Total best: <b>${total}</b> · Rank: <b>${rankOf(total)}</b></p>`:""}
   ${!last&&!nextOpen?`<p class="small">Floor ${n+1} opens on ${niceDate(UNLOCK[n+1])}. Come back then!</p>`:""}
   ${reviewHtml()}
   <div class="row">${nextOpen?`<button class="btn go" type="button" id="cNext">FLOOR ${n+1} ▶</button>`:""}<button class="btn ${nextOpen?"":"go"}" type="button" id="cFl">FLOORS</button><button class="btn" type="button" id="cAg">REPLAY</button></div>`);
  if(nextOpen) document.getElementById("cNext").onclick=()=>showBrief(n+1);
  document.getElementById("cFl").onclick=showFloors;
  document.getElementById("cAg").onclick=()=>showBrief(n);
}

/* ================= SEND TO INSTRUCTOR ================= */
function send(event,score,detail){
  if(!FORM.action||typeof fetch!=="function"||INSTRUCTOR) return;
  const total=[1,2,3,4].reduce((s,n)=>s+(P.best[n]||0),0);
  const body=new URLSearchParams();
  body.append(FORM.fields.name,P.name); body.append(FORM.fields.event,event);
  body.append(FORM.fields.sessions,"Mail Rush · "+Object.keys(P.cleared).length+"/4 floors");
  body.append(FORM.fields.xp,String(score==null?total:score));
  body.append(FORM.fields.report,(detail?detail+" · ":"")+"Best per floor: "+[1,2,3,4].map(n=>"F"+n+"="+(P.best[n]||0)).join(", ")+" · Total "+total);
  fetch(FORM.action,{method:"POST",mode:"no-cors",body}).catch(()=>{});
}

/* ================= CONTROLS ================= */
addEventListener("keydown",e=>{
  if(mode!=="play") return;
  if(/^Digit[1-5]$/.test(e.code)||/^Numpad[1-5]$/.test(e.code)){ e.preventDefault(); choose(+e.code.slice(-1)-1); }
  else if(e.code==="Space"||e.code==="Enter"){ e.preventDefault(); skipFb(); } });
document.getElementById("sndBtn").onclick=e=>{ SOUND=!SOUND; e.currentTarget.textContent="SOUND: "+(SOUND?"ON":"OFF"); e.currentTarget.setAttribute("aria-pressed",String(SOUND)); if(SOUND) SFX.coin(); };
document.getElementById("mapBtn").onclick=()=>{ if(!P.name) return nameGate(); showFloors(); };
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&mode==="play"){ mode="paused"; openModal(`<div class="tag">PAUSED</div><h2>Coffee break</h2><p>The belt stopped while you were away.</p><div class="row"><button class="btn go" type="button" id="rs">BACK TO WORK ▶</button></div>`); document.getElementById("rs").onclick=()=>{ closeModal(); mode="play"; }; } });

/* ================= BOOT ================= */
(async function boot(){
  try{ await Promise.race([document.fonts.load("8px 'Press Start 2P'"),new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  G=newGame(1); G.lanes=G.F.waves[0].lanes.map(k=>Object.assign({key:k},LANE[k])); G.phase="idle"; buildLaneButtons();
  setSay("maya","MAYA","Hi! I’m Maya. This week I run the Northline Build mail room. Help me send every message to the right place!");
  requestAnimationFrame(frame);
  nameGate();
})();
</script>
</body></html>
