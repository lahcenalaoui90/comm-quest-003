<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maya’s First Week</title>
<meta name="theme-color" content="#14152b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one arcade-cabinet column. Game screen on top, dialog strip under it, touch pad at the bottom. */
:root{
  --ink:#14152b; --panel:#22264d; --line:#3d4383; --paper:#f7f4ec; --sun:#ffd84a; --teal:#2bb3a3; --coral:#ff6b5a; --muted:#aeb2df; --good:#3fbf6a; --bad:#e2483d;
  --px:"Press Start 2P", ui-monospace, monospace; --body:"Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ink);color:var(--paper)}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:16px 16px}
.wrap{max-width:900px;margin:0 auto;padding-block:14px 24px;padding-inline:16px;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:6px;min-width:0}
h1{font-family:var(--px);font-size:clamp(15px,3.4vw,22px);margin:0;color:var(--sun);letter-spacing:1px;text-shadow:3px 3px 0 #000}
.sub{font-size:13px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--px);font-size:10px;line-height:1.3;background:var(--panel);color:var(--paper);border:2px solid #000;padding:10px 12px;cursor:pointer;box-shadow:0 3px 0 #000;border-radius:0}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000}
.btn:focus-visible,.opt:focus-visible,.pad button:focus-visible,.floor:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn.go{background:var(--sun);color:var(--ink)}
.btn.red{background:var(--coral);color:#fff}
.screen{position:relative;width:100%;max-width:min(640px,calc((100dvh - 380px) * 1.667));min-width:min(100%,300px);margin-inline:auto;border:4px solid #000;box-shadow:0 0 0 4px var(--line),0 10px 0 4px #000;background:#000;line-height:0}
#game{width:100%;height:auto;display:block;aspect-ratio:320/192;image-rendering:pixelated;image-rendering:crisp-edges}
.say{min-height:70px;background:var(--panel);border:3px solid #000;box-shadow:0 0 0 3px var(--line);padding:10px 12px;display:flex;gap:12px;align-items:center;font-size:15px}
.say canvas{width:36px;height:48px;image-rendering:pixelated;flex:none}
.say .txt{min-width:0}
.say b{font-family:var(--px);font-size:9px;color:var(--sun);display:block;margin-bottom:5px;letter-spacing:.5px}
.keys{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
kbd{font-family:var(--px);font-size:9px;background:var(--panel);border:2px solid #000;padding:3px 5px;color:var(--paper)}
.pad{display:none;justify-content:space-between;align-items:center;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none}
.pad .grp{display:flex;gap:12px}
.pad button{font-family:var(--px);width:78px;height:66px;font-size:20px;background:var(--panel);color:var(--paper);border:3px solid #000;box-shadow:0 5px 0 #000;touch-action:none;border-radius:0;-webkit-tap-highlight-color:transparent}
.pad button.jump{width:116px;background:var(--coral);font-size:12px}
.pad button.on{transform:translateY(4px);box-shadow:0 1px 0 #000}
@media (pointer:coarse){.pad{display:flex}.keys{display:none}}
.msg{background:var(--sun);color:var(--ink);border:4px solid #000;box-shadow:6px 6px 0 #000;padding:12px 14px;min-height:110px;cursor:default}
.msg .mtag{font-family:var(--px);font-size:9px;letter-spacing:1px;margin-bottom:8px;opacity:.75}
.msg p{margin:0;font-size:clamp(17px,2.6vw,21px);font-weight:500;line-height:1.35;text-wrap:balance}
#msgFb{font-size:15px;margin-top:8px}
#msgFb:empty{display:none}
#msgFb b{display:block;font-size:16px;margin-bottom:2px}
#msgFb .tap{display:block;font-size:12px;opacity:.7;margin-top:6px}
.msg.ok{background:#c9f2d6}.msg.no{background:#f7c7c2;cursor:pointer}
.lanes{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:10px}
@media (max-width:560px){.lanes{gap:7px}.lanes.n5{grid-template-columns:repeat(3,minmax(0,1fr))}.lane{font-size:12.5px;min-height:78px;padding:8px 3px 10px}.lane .ic{font-size:20px}.lane .lb{font-size:11.5px;letter-spacing:-.2px;overflow-wrap:anywhere}.msg{min-height:96px}.msg p{font-size:17px}}
.lane{font:500 15px var(--body);background:#fff;color:var(--ink);border:3px solid #000;border-top:10px solid var(--c);box-shadow:0 5px 0 #000;padding:10px 6px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:92px;border-radius:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;position:relative}
.lane:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.lane:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.lane i{font-style:normal;font-family:var(--px);font-size:9px;position:absolute;top:4px;left:5px;opacity:.6}
.lane .ic{font-size:24px;line-height:1.1}
.lane .lb{font-weight:700;text-align:center;line-height:1.2;hyphens:auto}
.review{margin-top:12px;display:grid;gap:8px}
.review>b{font-size:15px}
.rv{border:2px solid #000;background:#fff;padding:8px 10px;font-size:14px}
.rt{font-weight:500;margin-bottom:3px}.ra{color:#a3271f}.rw{color:#3b3f5c;margin-top:2px}
.deck{display:flex;flex-direction:column;gap:12px}
.swzone{position:relative;padding-top:26px}
.swhint{position:absolute;top:0;left:2px;font-family:var(--px);font-size:10px;opacity:.35;transition:opacity .15s}
.swhint.r{left:auto;right:2px}
.swcard{background:var(--sun);color:var(--ink);border:4px solid #000;box-shadow:6px 6px 0 #000;padding:14px 16px 12px;min-height:130px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;transition:transform .2s}
.swcard .mtag{font-family:var(--px);font-size:9px;letter-spacing:1px;margin-bottom:8px;opacity:.75}
.swcard p{margin:0;font-size:clamp(18px,2.8vw,22px);font-weight:500;line-height:1.35;text-wrap:balance}
#swFb{font-size:15px;margin-top:8px}#swFb:empty{display:none}#swFb b{display:block;font-size:16px;margin-bottom:2px}#swFb .tap{display:block;font-size:12px;opacity:.7;margin-top:6px}
.swcard.ok{background:#c9f2d6}.swcard.no{background:#f7c7c2;cursor:pointer}
.swtimer{height:6px;background:rgba(0,0,0,.15);margin-top:12px}.swtimer i{display:block;height:100%;width:100%;background:var(--ink)}
.swcard.done .swtimer{visibility:hidden}
.swbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swb{font:700 16px var(--body);background:#fff;color:var(--ink);border:3px solid #000;border-bottom:10px solid var(--c,#888);box-shadow:0 5px 0 #000;padding:16px 8px;cursor:pointer;border-radius:0;touch-action:manipulation}
.swb:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.swb:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.rwbox{display:grid;gap:8px}.rwbox:empty{display:none}
.rwq{font-family:var(--px);font-size:10px;color:var(--sun);line-height:1.6}.rwq span{color:var(--teal)}
/* modals */
.modal{position:fixed;inset:0;background:rgba(9,10,24,.84);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.card{background:var(--paper);color:var(--ink);border:4px solid #000;box-shadow:8px 8px 0 #000;max-width:600px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:22px 20px}
.card h2{font-family:var(--px);font-size:clamp(13px,3vw,17px);line-height:1.5;margin:0 0 10px;text-wrap:balance}
.card p{margin:0 0 12px}
.tag{font-family:var(--px);font-size:9px;letter-spacing:1px;color:#6a5a00;background:var(--sun);display:inline-block;padding:5px 7px;border:2px solid #000;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.defs{display:grid;gap:8px;margin:12px 0}
.def{border:2px solid #000;background:#fff;padding:9px 11px}
.def b{display:block;font-size:14px;margin-bottom:2px}
.def span{font-size:14px;color:#3b3f5c}
.how{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;margin:12px 0;font-size:15px}
.how .ic{width:34px;height:34px;image-rendering:pixelated}
input.name{font:500 18px var(--body);width:100%;padding:12px;border:3px solid #000;background:#fff;color:var(--ink);border-radius:0}
input.name:focus{outline:3px solid var(--teal);outline-offset:1px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
.q{font-size:17px;font-weight:500;margin-bottom:12px}
.ctx{font-size:15px;background:#fff;border:2px dashed #000;padding:10px;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:500 15px var(--body);background:#fff;color:var(--ink);border:3px solid #000;padding:11px 12px;cursor:pointer;box-shadow:0 3px 0 #000;display:flex;gap:10px;align-items:flex-start;border-radius:0}
.opt i{font-style:normal;font-family:var(--px);font-size:10px;background:var(--ink);color:#fff;padding:4px 6px;flex:none;margin-top:1px}
.opt:hover{background:#fff6cf}
.opt.right{background:#d9f5e1;border-color:var(--good)}
.opt.wrong{background:#fbdcd8;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.why{margin-top:12px;padding:10px 12px;border:3px solid #000;font-size:15px}
.why.ok{background:#d9f5e1}.why.no{background:#fbdcd8}
.floors{display:grid;gap:10px;margin-top:8px}
.floor{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;color:var(--ink);border:3px solid #000;box-shadow:0 4px 0 #000;padding:10px 12px;cursor:pointer;font:15px var(--body);border-radius:0}
.floor .n{font-family:var(--px);font-size:14px;background:var(--ink);color:var(--sun);width:40px;height:40px;display:grid;place-items:center}
.floor .t{min-width:0}
.floor .t b{display:block;font-size:15px}
.floor .t span{font-size:13px;color:#4a4f70}
.floor .st{font-family:var(--px);font-size:9px;text-align:right;white-space:nowrap}
.floor.locked{background:#e5e2d8;cursor:not-allowed;box-shadow:none;opacity:.85}
.floor.locked .n{background:#777;color:#ddd}
.floor .n{font-family:var(--body);font-size:20px}
.floor.today{background:#fff6cf;box-shadow:0 4px 0 #000,0 0 0 3px var(--sun)}
.floor.today .st{color:#1d7a3e}
@media (max-width:480px){.floor{grid-template-columns:auto 1fr}.floor .st{grid-column:2;text-align:left}}
.floor.done .st{color:#1d7a3e}
.big{font-family:var(--px);font-size:clamp(20px,6vw,30px);color:var(--coral);text-shadow:3px 3px 0 #000;margin:6px 0 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{border:3px solid #000;background:#fff;padding:10px 8px;text-align:center}
.stat b{font-family:var(--px);font-size:14px;display:block;margin-bottom:6px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:#4a4f70}
.small{font-size:13px;color:#4a4f70}
.foot{font-size:13px;color:var(--muted);text-align:center}
.foot b{color:var(--paper);font-weight:500;user-select:all}
@media (max-width:420px){.card{padding:18px 14px}.pad button{width:68px}.pad button.jump{width:100px}.stats{grid-template-columns:1fr 1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>MAYA’S FIRST WEEK</h1>
      <div class="sub">Module 3 : Business Communication · Lesson 1 · <span id="who"></span></div>
    </div>
    <div class="tools">
      <button class="btn" id="mapBtn" type="button">FLOORS</button>
      <button class="btn" id="sndBtn" type="button" aria-pressed="false">SOUND: OFF</button>
    </div>
  </header>
  <div class="screen"><canvas id="game" width="320" height="192" aria-label="Game screen"></canvas></div>
  
  <div id="sortDeck" class="deck"><div class="msg" id="msg" aria-live="polite"><div class="mtag" id="msgTag">INCOMING</div><p id="msgText">Your shift starts soon.</p><div id="msgFb"></div></div>
  <div class="lanes" id="lanes"></div></div>
  <div id="swipeDeck" class="deck" hidden>
    <div class="swzone"><div class="swhint" id="hintL">◀ VAGUE</div><div class="swhint r" id="hintR">CLEAR ▶</div>
      <div class="swcard" id="swCard"><div class="mtag" id="swTag">CARD</div><p id="swText">Get ready…</p><div id="swFb"></div><div class="swtimer"><i id="swBar"></i></div></div></div>
    <div class="rwbox" id="rwBox"></div>
    <div class="swbtns"><button type="button" class="swb" id="btnL">◀ VAGUE</button><button type="button" class="swb" id="btnR">CLEAR ▶</button></div>
  </div>
  <div class="say" id="say" aria-live="polite"><canvas id="face" width="12" height="16"></canvas><div class="txt"><b id="sayName">MAYA</b><span id="sayText">Ready when you are.</span></div></div>
  <div class="keys"><span>Tap a bin, or press <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd>… · Swipe days: <kbd>←</kbd> <kbd>→</kbd></span><span><kbd>SPACE</kbd> skip the explanation</span></div>
  <div class="foot">Questions? Email your instructor: <b>mdarhri.lahcen@a1gcollege.ca</b></div>
</div>

<div class="modal" id="modal"><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
<script>
/* ================= CONFIG ================= */
const UNLOCK = { 1:"2026-10-13", 2:"2026-10-14", 3:"2026-10-15" };
const DAYS=[1,2,3];
const DAY_OF = {1:"Tuesday",2:"Wednesday",3:"Thursday"};
const FORM = {
  action: "https://docs.google.com/forms/d/e/1FAIpQLScn7993TFDvzk7TY9Q3HHvW3Y_6BI1v8H3pEb45xNOvFE-TYQ/formResponse",
  fields: { name:"entry.441402498", event:"entry.1776007161", sessions:"entry.28314834", xp:"entry.383135505", report:"entry.88272251" }
};
const INSTRUCTOR = location.hash === "#instructor";
const NPCPAL = {
  sam:  {Y:"#2b2b2b",y:"#1a1a1a",H:"#2b2b2b",S:"#8d5a3b",T:"#3a5bd9",W:"#ffffff",P:"#2a2a40",B:"#222"},
  lina: {Y:"#b5452d",y:"#8a2f1c",H:"#b5452d",S:"#f0c7a0",T:"#9b59b6",W:"#ffffff",P:"#333355",B:"#3a2a1a"},
  omar: {Y:"#1d1d1d",y:"#111",H:"#1d1d1d",S:"#b9835a",T:"#e67e22",W:"#ffffff",P:"#34495e",B:"#222"},
  grace:{Y:"#f1d36b",y:"#c9a83a",H:"#f1d36b",S:"#f3d2b3",T:"#27ae60",W:"#ffffff",P:"#2c3e50",B:"#4a2f1a"},
  priya:{Y:"#151515",y:"#0c0c0c",H:"#151515",S:"#a86b45",T:"#d63a6a",W:"#ffffff",P:"#2a2a40",B:"#222"},
  ken:  {Y:"#6b6b6b",y:"#4d4d4d",H:"#6b6b6b",S:"#e8bf98",T:"#5b6c7d",W:"#ffffff",P:"#1f2a36",B:"#111"}
};

/* ================= LANES (bins) ================= */
const LANE = {
  mix:{label:"Mixed signal",px:"MIXED",icon:"⚠",col:"#e2483d",why:"Mixed signal: the words say one thing, the body or voice says another."},
  con:{label:"Consistent",px:"MATCH",icon:"✔",col:"#3fbf6a",why:"Consistent: words, voice and body all say the same thing."},
  brg:{label:"Builds a bridge",px:"BRIDGE",icon:"🤝",col:"#2bb3a3",why:"Bridging cultures: withhold judgment, empathize, tolerate ambiguity, find common ground, treat each person as an individual."},
  blk:{label:"Builds a wall",px:"WALL",icon:"🧱",col:"#d35400",why:"This creates an intercultural barrier. Withhold judgment and treat each person as an individual."},
  down:{label:"Downward",px:"DOWN",icon:"⬇",col:"#4a7bd9",why:"Downward: from a higher level to lower levels."},
  up:{label:"Upward",px:"UP",icon:"⬆",col:"#e2483d",why:"Upward: from a lower level to higher levels."},
  lat:{label:"Lateral",px:"LATERAL",icon:"➡",col:"#2bb3a3",why:"Lateral: between people at the same level."},
  enc:{label:"Encode",px:"ENCODE",icon:"✎",col:"#4a7bd9",why:"Encode: the sender turns a thought into words, images or actions."},
  chan:{label:"Channel",px:"CHANNEL",icon:"✉",col:"#9b59b6",why:"Channel: the way the message travels (email, phone, meeting…)."},
  dec:{label:"Decode",px:"DECODE",icon:"👁",col:"#2bb3a3",why:"Decode: the receiver gives meaning to the message."},
  fb:{label:"Feedback",px:"FEEDBACK",icon:"↩",col:"#ff9f1c",why:"Feedback: the receiver’s response, which shows if the message was understood."},
  noise:{label:"Noise · shred",px:"SHRED",icon:"✂",col:"#6b7086",why:"Noise: anything that disrupts the loop. Shred it!"},
  dis:{label:"Distrac\u00ADtions",px:"DISTRACT",icon:"📱",col:"#7a5cff",why:"Distractions. Fix: move to a quiet place and silence notifications."},
  tim:{label:"Timing",px:"TIMING",icon:"⏰",col:"#ff9f1c",why:"Timing. Fix: ask “Is now a good time?” and book a slot if not."},
  str:{label:"Stress",px:"STRESS",icon:"💢",col:"#e2483d",why:"Stress. Fix: plan ahead, organize, set priorities."},
  clo:{label:"Closed mind",px:"CLOSED",icon:"🔒",col:"#5d6d7e",why:"Closed-mindedness. Fix: listen to the end before judging."},
  ass:{label:"Assumptions",px:"ASSUME",icon:"❓",col:"#16a085",why:"Different assumptions. Fix: find out what the receiver already knows."},
  bac:{label:"Backgrounds",px:"BACKGRND",icon:"🌍",col:"#d35400",why:"Different backgrounds. Fix: plain words, context, check understanding."},
  per:{label:"Personality",px:"PERSON.",icon:"🎭",col:"#e84393",why:"Personality differences. Fix: adapt your style to the receiver."},
  act:{label:"Active listen\u00ADing",px:"ACTIVE",icon:"👂",col:"#3fbf6a",why:"Active listening: you listen accurately and show you are paying attention."},
  not:{label:"Not listening",px:"NOT",icon:"🙉",col:"#e2483d",why:"Not listening: attention is somewhere else."},
  wor:{label:"Words · 7%",px:"WORDS 7",icon:"Aa",col:"#4a7bd9",why:"Words carry only 7% of meaning when words and face disagree."},
  voi:{label:"Voice · 38%",px:"VOICE 38",icon:"🔊",col:"#ff9f1c",why:"Voice (tone, pace, volume) carries 38%. This is paralanguage."},
  fac:{label:"Face · 55%",px:"FACE 55",icon:"🙂",col:"#e84393",why:"The face carries 55% of meaning."},
  foc:{label:"1 · Focusing",px:"FOCUS",icon:"🎯",col:"#4a7bd9",why:"Focusing: decide to listen and create the right atmosphere."},
  int:{label:"2 · Interpre\u00ADting",px:"INTERPRET",icon:"💭",col:"#9b59b6",why:"Interpreting: hold back judgment and work out the meaning."},
  eva:{label:"3 · Evalua\u00ADting",px:"EVALUATE",icon:"⚖",col:"#ff9f1c",why:"Evaluating: gather more information and decide if it is genuine."},
  res:{label:"4 · Respon\u00ADding",px:"RESPOND",icon:"💬",col:"#3fbf6a",why:"Responding: decide what to do and reply."}
};

/* ================= DAYS ================= */
const FLOORS = {
1:{ type:"sort", name:"MAIL RUSH", short:"Session 1 · Directions, the loop, barriers", boss:"sam",
  brief:[["Directions ⬇ ⬆ ➡","Downward: from managers to staff. Upward: from staff to managers. Lateral: between people at the same level."],
         ["The loop","Sender has a thought → Encode → Channel → Decode → Feedback. Communication is a loop, not a broadcast."],
         ["Noise","Anything that breaks the loop: a loud room, a vague word, a frozen call."],
         ["7 barriers","Distractions · Timing · Stress · Closed mind · Assumptions · Backgrounds · Personality. Each one has a fix."]],
  mission:"Messages roll down the belt. Send each one to the right bin before it falls into LOST MAIL. 4 waves, new bins each time.",
  waves:[
   {title:"Wave 1 · Which way?",pick:8,lanes:["down","up","lat"],items:[
    ["The CEO emails all staff about the new vacation policy.","down"],["A supervisor posts next week’s shift schedule.","down"],
    ["The site manager tells the crew about the new safety rules.","down"],["HR sends every employee the updated dress code.","down"],
    ["A director gives her team feedback after the audit.","down"],
    ["A cashier suggests a faster restocking method to the store manager.","up"],["An employee sends her monthly progress report to the director.","up"],
    ["A carpenter tells the foreman that a delivery is missing.","up"],["Staff fill in a survey for the CEO about morale.","up"],
    ["A coordinator asks her manager a question about the budget.","up"],
    ["Two project coordinators compare schedules to avoid a clash.","lat"],["Marketing and sales meet to plan a campaign.","lat"],
    ["The electrician and the plumber agree on who works first.","lat"],["Two cashiers swap shifts.","lat"],
    ["Accounting asks purchasing for last month’s invoices.","lat"]]},

let last=0, accT=0;
function frame(t){ requestAnimationFrame(frame); const dt=Math.min(100,t-(last||t)); last=t;
  const up = G&&G.type==="swipe"?swUpdate:sortUpdate, dr = G&&G.type==="swipe"?swDraw:sortDraw;
  if(mode==="play"&&G){ accT+=dt; while(accT>=1000/60){ up(); accT-=1000/60; if(mode!=="play"){ accT=0; break; } } } else accT=0;
  dr(); }
/* ================= CLEAR OR VAGUE? (swipe engine) ================= */
function newSwipe(n){
  const F=FLOORS[n];
  const picked=F.rounds.map(r=>shuffle(r.items.slice()).slice(0,r.pick||r.items.length));
  return {type:"swipe",n,F,ri:0,picked,queue:[],cur:null,phase:"banner",bT:110,banner:"",lives:3,score:0,combo:0,maxCombo:0,ok:0,tot:0,
    mistakes:[],done:0,totalItems:picked.reduce((s,r)=>s+r.length,0),fbT:0,fbMin:0,fly:null,mood:0,stamp:null,lanes:[]};
}
function swStart(){ swRound(0); }
function swRound(i){ const R=G.F.rounds[i]; G.ri=i; G.queue=G.picked[i].slice(); G.phase="banner"; G.bT=i?130:110; G.banner=R.title.toUpperCase();
  swSetSides(R); swCard("ROUND "+(i+1)+" OF "+G.F.rounds.length, "Get ready…", ""); }
function swSetSides(R){
  const l=document.getElementById("btnL"), r=document.getElementById("btnR");
  l.innerHTML=`<span aria-hidden="true">◀ ${R.L.icon}</span> ${esc(R.L.label)}`; r.innerHTML=`${esc(R.R.label)} <span aria-hidden="true">${R.R.icon} ▶</span>`;
  l.style.setProperty("--c",R.L.col); r.style.setProperty("--c",R.R.col);
  document.getElementById("hintL").textContent="◀ "+R.L.label; document.getElementById("hintR").textContent=R.R.label+" ▶";
  document.getElementById("hintL").style.color=R.L.col; document.getElementById("hintR").style.color=R.R.col; }
function swDur(){ return Math.max(6, 13 - G.ok*.25); }
function swNext(){
  document.getElementById("rwBox").innerHTML="";
  if(!G.queue.length){ if(G.ri+1<G.F.rounds.length){ swRound(G.ri+1); return; } finishShift(); return; }
  const it=G.queue.shift(); G.cur={it,t:0,dur:swDur()*60}; G.phase="run"; G.stamp=null;
  swCard("CARD "+(G.done+1)+"/"+G.totalItems, it.t, ""); resetCardPos();
}
function swCard(tag,text,fb,cls){ document.getElementById("swTag").textContent=tag; if(text!==null) document.getElementById("swText").textContent=text;
  document.getElementById("swFb").innerHTML=fb||""; document.getElementById("swCard").className="swcard"+(cls?" "+cls:""); }
function decide(side){
  if(mode!=="play"||!G||G.type!=="swipe"||G.phase!=="run") return;
  const it=G.cur.it, R=G.F.rounds[G.ri], saidRight=side==="R", ok=saidRight===it.r, frac=1-G.cur.t/G.cur.dur;
  G.done++; G.tot++; flyCard(side); G.fly={side,t:0};
  if(ok){ G.combo++; G.maxCombo=Math.max(G.maxCombo,G.combo); G.ok++; const mult=Math.min(4,1+Math.floor(G.combo/3)); const pts=100*mult+Math.round(50*frac);
    G.score+=pts; G.mood=40; G.stamp={ok:true,t:40}; SFX.coin(); if(G.combo%3===0) SFX.good();
    if(it.rw){ G.phase="rewrite"; G.lastPts=pts; showRewrite(it,pts,mult); return; }
    swFeedback(true,"✓ Right! +"+pts+(mult>1?" · combo x"+mult:""),it.why,75); }
  else { G.combo=0; G.lives--; G.mood=-60; G.stamp={ok:false,t:60}; SFX.bad();
    G.mistakes.push({t:it.t,your:(saidRight?R.R.label:R.L.label),right:(it.r?R.R.label:R.L.label),why:it.why});
    swFeedback(false,"✗ That one is "+(it.r?R.R.label:R.L.label)+".",it.why,170); }
}
function showRewrite(it,pts,mult){
  const opts=shuffle(it.rw.map((t,i)=>({t,i})));
  swCard("REWRITE IT!", it.t, `<b>✓ Yes, it’s vague! +${pts}${mult>1?" · combo x"+mult:""}</b> ${esc(it.why)}`, "ok");
  document.getElementById("rwBox").innerHTML=`<div class="rwq">Which rewrite is clearest? <span>+150 bonus</span></div>`+opts.map((o,k)=>`<button type="button" class="opt" data-i="${o.i}"><i>${k+1}</i><span>${esc(o.t)}</span></button>`).join("");
  document.querySelectorAll("#rwBox .opt").forEach(b=>b.onclick=()=>pickRewrite(+b.dataset.i,it));
}
function pickRewrite(i,it){
  if(G.phase!=="rewrite") return; const ok=i===0;
  document.querySelectorAll("#rwBox .opt").forEach(b=>{ b.disabled=true; const j=+b.dataset.i; if(j===0) b.classList.add("right"); else if(j===i) b.classList.add("wrong"); });
  if(ok){ G.score+=150; SFX.good(); swFeedback(true,"✓ Perfect rewrite! +150","It says exactly what, who and when.",90,true); }
  else { SFX.bad(); G.mistakes.push({t:it.t,your:"Rewrite: "+it.rw[i],right:"Rewrite: "+it.rw[0],why:"A clear message says what, who and when."});
    swFeedback(false,"✗ Still vague. The best rewrite is highlighted in green.","A clear message says exactly what, who and when.",170,true); }
}
function swFeedback(ok,head,why,frames,keepRw){ G.phase="fb"; G.fbT=frames; G.fbMin=frames-30;
  if(!keepRw) document.getElementById("rwBox").innerHTML="";
  document.getElementById("swFb").innerHTML=`<b>${esc(head)}</b> ${esc(why)}${ok?"":`<span class="tap">Tap here or press Space to continue</span>`}`;
  document.getElementById("swCard").className="swcard done "+(ok?"ok":"no"); }
function swSkip(){ if(G&&G.type==="swipe"&&G.phase==="fb"&&G.fbT<G.fbMin) G.fbT=0; }
function swUpdate(){
  tick++; if(G.mood>0) G.mood--; else if(G.mood<0) G.mood++; if(G.stamp&&--G.stamp.t<=0) G.stamp=null; if(G.fly) G.fly.t++;
  if(G.phase==="run"){ G.cur.t++; document.getElementById("swBar").style.width=Math.max(0,100-G.cur.t/G.cur.dur*100)+"%";
    if(G.cur.t>=G.cur.dur){ const it=G.cur.it, R=G.F.rounds[G.ri]; G.done++; G.tot++; G.combo=0; G.lives--; G.mood=-60; G.stamp={ok:false,t:60}; SFX.hurt();
      G.mistakes.push({t:it.t,your:"(too late)",right:(it.r?R.R.label:R.L.label),why:it.why}); swFeedback(false,"⏰ Too late! That one is "+(it.r?R.R.label:R.L.label)+".",it.why,170); } }
  else if(G.phase==="fb"){ if(--G.fbT<=0){ if(G.lives<=0){ mode="over"; showOver(); return; } swNext(); } }
  else if(G.phase==="banner"){ if(--G.bT<=0) swNext(); }
  parts=parts.filter(q=>{ q.x+=q.vx; q.y+=q.vy; return --q.life>0; });
}

    P=loadProf(v); P.name=v; saveProf(); document.getElementById("who").textContent=v; send("Game · Signed in",null,""); goToday(); };
  document.getElementById("nmGo").onclick=go; inp.onkeydown=e=>{ if(e.key==="Enter") go(); };
}

/* floor availability */
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dateOpen(n){ return INSTRUCTOR || today()>=UNLOCK[n]; }
function floorOpen(n){ return dateOpen(n) && (n===1 || INSTRUCTOR || P.cleared[n-1]); }
function niceDate(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("en-CA",{weekday:"long",month:"long",day:"numeric"}); }

function showFloors(){
  mode="menu"; const tot=DAYS.reduce((s,n)=>s+(P.best[n]||0),0);
  const rows=DAYS.map(n=>{ const F=FLOORS[n], open=floorOpen(n), done=!!P.cleared[n];
    const st = done ? "✓ BEST "+P.best[n] : open ? "PLAY ▶" : (!dateOpen(n) ? "🔒 "+DAY_OF[n].toUpperCase() : "🔒 FINISH DAY "+(n-1));
    return `<button class="floor ${open?"":"locked"} ${done?"done":""}" type="button" data-n="${n}" ${open?"":"aria-disabled=\"true\""}>
      <span class="n">${n}</span><span class="t"><b>${F.name}</b><span>${F.short}${!dateOpen(n)?" · opens "+niceDate(UNLOCK[n]):""}</span></span><span class="st">${st}</span></button>`; }).join("");
  openModal(`<div class="tag">BUILDING DIRECTORY${INSTRUCTOR?" · INSTRUCTOR MODE":""}</div><h2>Choose a day</h2>
    <p class="small">A new part opens each day: Tuesday, Wednesday, then Thursday. Finish a day to unlock the next one.</p>
    <div class="floors">${rows}</div>
    <div class="stats"><div class="stat"><b>${tot}</b><span>total best points</span></div><div class="stat"><b>${Object.keys(P.cleared).length}/${DAYS.length}</b><span>days done</span></div><div class="stat"><b>${rankOf(tot)}</b><span>your rank</span></div></div>
    <div class="row"><button class="btn" type="button" id="howBtn">HOW TO PLAY</button><button class="btn" type="button" id="swBtn">NOT ${esc(P.name.split(" ")[0].toUpperCase())}?</button></div>`);
  card.querySelectorAll(".floor").forEach(b=>b.onclick=()=>{ const n=+b.dataset.n; if(!floorOpen(n)){ b.querySelector(".st").textContent = !dateOpen(n)?"OPENS "+DAY_OF[n].toUpperCase():"FINISH DAY "+(n-1)+" FIRST"; return; } showBrief(n); });
  document.getElementById("howBtn").onclick=()=>showHow(showFloors);
  document.getElementById("swBtn").onclick=nameGate;
}

function todaysFloor(){ let f=0; for(const n of DAYS){ if(!dateOpen(n)) break; f=n; if(!P.cleared[n]) return n; } return f||null; }
function goToday(){ if(INSTRUCTOR) return showFloors(); showWeek(); }
function showWeek(){
  mode="menu"; const f=todaysFloor(); const icons={1:"📬",2:"🗂",3:"🌍"};
  const rows=DAYS.map(n=>{ const F=FLOORS[n], done=!!P.cleared[n], isToday=n===f;
    let st, cls;
    if(isToday){ st=done?"REPLAY ▶":"PLAY ▶"; cls="today"; }
    else if(done){ st="✓ DONE · "+P.best[n]+" pts"; cls="done locked"; }
    else if(!dateOpen(n)){ st="🔒 LOCKED"; cls="locked"; }
    else { st="🔒 FINISH "+DAY_OF[n-1].toUpperCase()+" FIRST"; cls="locked"; }
    return `<button class="floor ${cls}" type="button" data-n="${n}" ${isToday?"":"aria-disabled=\"true\""}>
      <span class="n" aria-hidden="true">${icons[n]}</span><span class="t"><b>${DAY_OF[n]} · ${F.name}</b><span>${esc(F.short)}<br>${isToday?"Open now":(done?"Completed":"Opens on "+niceDate(UNLOCK[n]))}</span></span><span class="st">${st}</span></button>`; }).join("");
  const first=esc(P.name.split(" ")[0]);
  openModal(`<div class="tag">MODULE 3 · LESSON 1 · THIS WEEK</div><h2>Hi ${first}! Your week at Northline Build</h2>
    <p class="small">One game per day. Each game opens on its day: Tuesday, Wednesday, then Thursday.</p>
    <div class="floors">${rows}</div>
    ${f?"":`<p><b>Nothing to play yet.</b> The first game opens on ${niceDate(UNLOCK[1])}.</p>`}
    <div class="row">${f?`<button class="btn go" type="button" id="wGo">START ${DAY_OF[f].toUpperCase()} ▶</button>`:""}<button class="btn" type="button" id="wNo">NOT ${first.toUpperCase()}?</button></div>`);
  card.querySelectorAll(".floor").forEach(b=>b.onclick=()=>{ if(+b.dataset.n===f) showBrief(f); });
  if(f) document.getElementById("wGo").onclick=()=>showBrief(f);
  document.getElementById("wNo").onclick=nameGate;
}
function rankOf(x){ return x>=25000?"DIRECTOR":x>=17000?"MANAGER":x>=9000?"COORD.":"INTERN"; }
function setDeck(type){ document.getElementById("sortDeck").hidden = type==="swipe"; document.getElementById("swipeDeck").hidden = type!=="swipe"; }

/* message card + lane buttons */
const msgEl=document.getElementById("msg");
function showMsg(tag,text,fb,cls){
  if(tag!==null) document.getElementById("msgTag").textContent=tag;
  if(text!==null) document.getElementById("msgText").textContent=text;
  document.getElementById("msgFb").innerHTML=fb||"";
  msgEl.className="msg"+(cls?" "+cls:"");
}
function buildLaneButtons(){
  const box=document.getElementById("lanes"); box.innerHTML="";
  box.style.setProperty("--n",G.lanes.length); box.className="lanes n"+G.lanes.length;
  G.lanes.forEach((L,i)=>{ const b=document.createElement("button"); b.type="button"; b.className="lane"; b.style.setProperty("--c",L.col);
    b.innerHTML=`<i>${i+1}</i><span class="ic" aria-hidden="true">${L.icon}</span><span class="lb">${esc(L.label)}</span>`;
    b.addEventListener("pointerdown",e=>{ e.preventDefault(); choose(i); }); b.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); choose(i);} });
    box.appendChild(b); });
}
msgEl.addEventListener("click",()=>skipFb());

function showHow(back){
  const ic=c=>`<img class="ic" alt="" src="${iconImg(c,3)}">`;
  const sw = G&&G.type==="swipe";
  openModal(`<div class="tag">HOW TO PLAY</div><h2>${sw?"Clear or vague?":"Mail room survival guide"}</h2>
   <div class="how">${sw?`
    ${ic(SENV)}<span>Read the yellow card. <b>Swipe it</b> left or right, or tap the buttons (keyboard: ← →).</span>
    ${ic(MAYA.jump)}<span>When you spot a <b>vague</b> message, pick the clearest rewrite: <b>+150 bonus</b>.</span>`:`
    ${ic(PARCEL)}<span>A message rolls along the belt. <b>Read it</b> in the yellow card under the game.</span>
    ${ic(MAYA.jump)}<span><b>Tap the right bin</b> (or press 1, 2, 3…) before the parcel reaches <b>LOST MAIL</b>.</span>`}
    ${ic(SCUP)}<span>You have <b>3 coffees</b>. A wrong answer or running out of time costs one.</span>
    ${ic(SCARD)}<span>3 right answers in a row = <b>combo</b>: points ×2, ×3, ×4. Faster answers = bonus points.</span>
   </div>
   <p class="small">Your best score each day is sent to your instructor automatically.</p>
   <div class="row"><button class="btn go" type="button" id="hb">GOT IT ▶</button></div>`);
  document.getElementById("hb").onclick=back;
}
function showBrief(n){
  const F=FLOORS[n]; floorN=n; G=newGame(n); G.phase="idle"; mode="menu"; setDeck(F.type);
  if(F.type==="swipe"){ swSetSides(F.rounds[0]); swCard(DAY_OF[n].toUpperCase(),"Your day starts when you press START.",""); }
  else { G.lanes=G.F.waves[0].lanes.map(k=>Object.assign({key:k},LANE[k])); buildLaneButtons(); showMsg(DAY_OF[n].toUpperCase(), "Your shift starts when you press START.", ""); }
  openModal(`<div class="tag">${DAY_OF[n].toUpperCase()} · ${esc(F.short.toUpperCase())}</div><h2>${F.name}</h2>
   <div class="defs">${F.brief.map(([t,d])=>`<div class="def"><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join("")}</div>
   <p><b>Mission:</b> ${esc(F.mission)}</p>
   <div class="row"><button class="btn go" type="button" id="bGo">START ▶</button><button class="btn" type="button" id="bHow">HOW TO PLAY</button><button class="btn" type="button" id="bBack">${INSTRUCTOR?"FLOORS":"THIS WEEK"}</button></div>`);
  document.getElementById("bGo").onclick=()=>{ closeModal(); startFloor(n); };
  document.getElementById("bHow").onclick=()=>showHow(()=>showBrief(n));
  document.getElementById("bBack").onclick=goToday;
}
function showOver(){
  openModal(`<div class="tag">${DAY_OF[floorN].toUpperCase()}</div><div class="big">OUT OF COFFEE</div>
   <p>Too many wrong answers this time. Look at the review below, then try again.</p>
   ${reviewHtml()}
   <div class="row"><button class="btn go" type="button" id="oGo">TRY AGAIN ▶</button><button class="btn" type="button" id="oBack">${INSTRUCTOR?"FLOORS":"THIS WEEK"}</button></div>`);
  document.getElementById("oGo").onclick=()=>{ closeModal(); startFloor(floorN); };
  document.getElementById("oBack").onclick=goToday;
}
function reviewHtml(){ if(!G.mistakes.length) return `<p class="small">No mistakes. Perfect!</p>`;
  return `<div class="review"><b>Review your mistakes</b>${G.mistakes.map(m=>`<div class="rv"><div class="rt">${esc(m.t)}</div><div class="ra">You: ${esc(m.your)} → Right answer: <b>${esc(m.right)}</b></div><div class="rw">${esc(m.why)}</div></div>`).join("")}</div>`; }
function finishShift(){
  mode="clear"; SFX.win();
  const n=floorN, score=G.score, prev=P.best[n]||0, isBest=score>prev, first=!P.cleared[n];
  P.cleared[n]=true; if(isBest) P.best[n]=score; saveProf();
  if(isBest||first) send("Game · "+DAY_OF[n]+" ("+FLOORS[n].name+") done"+(isBest&&!first?" (new best)":""), score, DAY_OF[n]+": "+G.ok+"/"+G.tot+" correct, best combo "+G.maxCombo);
  const total=DAYS.reduce((s,k)=>s+(P.best[k]||0),0), last=n===DAYS.length, nextOpen=!last&&floorOpen(n+1);
  const acc=Math.round(G.ok/Math.max(1,G.tot)*100);
  openModal(`<div class="tag">${DAY_OF[n].toUpperCase()} · DONE</div><div class="big">${last?"LESSON 1 COMPLETE!":acc>=80?"GREAT JOB!":"DAY DONE"}</div>
   <div class="stats"><div class="stat"><b>${score}</b><span>points</span></div><div class="stat"><b>${acc}%</b><span>accuracy</span></div><div class="stat"><b>x${Math.min(4,1+Math.floor(G.maxCombo/3))}</b><span>best combo</span></div></div>
   <p>${isBest?"New best score! It has been sent to your instructor.":"Your best for "+DAY_OF[n]+" is still "+prev+" points."}</p>
   ${last?`<p>Total best: <b>${total}</b> · Rank: <b>${rankOf(total)}</b></p>`:""}
   ${!last&&!nextOpen?`<p class="small">The next part opens on <b>${niceDate(UNLOCK[n+1])}</b>. Come back then! You can replay today’s game to beat your score.</p>`:""}
   ${reviewHtml()}
   <div class="row">${nextOpen?`<button class="btn go" type="button" id="cNext">${DAY_OF[n+1].toUpperCase()} ▶</button>`:""}<button class="btn" type="button" id="cFl">${INSTRUCTOR?"FLOORS":"THIS WEEK"}</button><button class="btn ${nextOpen?"":"go"}" type="button" id="cAg">REPLAY</button></div>`);
  if(nextOpen) document.getElementById("cNext").onclick=()=>showBrief(n+1);
  document.getElementById("cFl").onclick=goToday;
  document.getElementById("cAg").onclick=()=>showBrief(n);
}

/* ================= SEND TO INSTRUCTOR ================= */
function send(event,score,detail){
  if(!FORM.action||typeof fetch!=="function"||INSTRUCTOR) return;
  const total=DAYS.reduce((s,n)=>s+(P.best[n]||0),0);
  const body=new URLSearchParams();
  body.append(FORM.fields.name,P.name); body.append(FORM.fields.event,event);
  body.append(FORM.fields.sessions,"Maya’s First Week · "+Object.keys(P.cleared).length+"/"+DAYS.length+" days");
  body.append(FORM.fields.xp,String(score==null?total:score));
  body.append(FORM.fields.report,(detail?detail+" · ":"")+"Best: "+DAYS.map(n=>DAY_OF[n].slice(0,3)+"="+(P.best[n]||0)).join(", ")+" · Total "+total);
  fetch(FORM.action,{method:"POST",mode:"no-cors",body}).catch(()=>{});
}

/* ================= CONTROLS ================= */
addEventListener("keydown",e=>{
  if(mode!=="play") return;
  if(G&&G.type==="swipe"){
    if(e.code==="ArrowLeft"){ e.preventDefault(); decide("L"); } else if(e.code==="ArrowRight"){ e.preventDefault(); decide("R"); }
    else if(G.phase==="rewrite"&&/^Digit[1-3]$/.test(e.code)){ const bt=document.querySelectorAll("#rwBox .opt")[+e.code.slice(-1)-1]; if(bt) bt.click(); }
    else if(e.code==="Space"||e.code==="Enter"){ e.preventDefault(); swSkip(); } return; }
  if(/^Digit[1-5]$/.test(e.code)||/^Numpad[1-5]$/.test(e.code)){ e.preventDefault(); choose(+e.code.slice(-1)-1); }
  else if(e.code==="Space"||e.code==="Enter"){ e.preventDefault(); skipFb(); } });
document.getElementById("sndBtn").onclick=e=>{ SOUND=!SOUND; e.currentTarget.textContent="SOUND: "+(SOUND?"ON":"OFF"); e.currentTarget.setAttribute("aria-pressed",String(SOUND)); if(SOUND) SFX.coin(); };
const mapBtn=document.getElementById("mapBtn"); if(!INSTRUCTOR) mapBtn.hidden=true; mapBtn.onclick=()=>{ if(!P.name) return nameGate(); showFloors(); };
document.addEventListener("visibilitychange",()=>{ if(document.hidden&&mode==="play"){ mode="paused"; openModal(`<div class="tag">PAUSED</div><h2>Coffee break</h2><p>The game paused while you were away.</p><div class="row"><button class="btn go" type="button" id="rs">BACK TO WORK ▶</button></div>`); document.getElementById("rs").onclick=()=>{ closeModal(); mode="play"; }; } });

/* ================= BOOT ================= */
(async function boot(){
  try{ await Promise.race([document.fonts.load("8px 'Press Start 2P'"),new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  G=newGame(1); G.lanes=G.F.waves[0].lanes.map(k=>Object.assign({key:k},LANE[k])); G.phase="idle"; buildLaneButtons();
  setSay("maya","MAYA","Hi! I’m Maya, new at Northline Build. Help me get through my first week!");
  requestAnimationFrame(frame);
  nameGate();
})();
</script>
</body></html>
